name: dev-pcd-interop
type: alphanet
description: |
  Sample devnet manifest for testing.
  * Permissionless fault proofs
  * SUPER_CANNON_KONA game type (interop + fp-interop + fp-permissionless)
  * Settles on Sepolia

metadata:
  domain: op-enterprise
  team: raas
  tenant_id: t-sample01
  tenant_name: my-devnet
  tier_id: "100"

cluster:
  name: oplabs-dev-ent-networks-us-ue1-0

features:
  - interop
  - per-el-bootnode-gen

l1:
  name: sepolia
  chain_id: 11155111
  eth_rpc: https://ethereum-sepolia-rpc.publicnode.com

l2:
  deployment:
    op-deployer:
      version: 0.8.0-pcd-test.5
    opcm_address: "0x50c6fC25864d3f0791f4eD588E016F9B71d57fAC"
    superchain_config_proxy: "0xD153EEFA81f2232Ea5c5Ec25DA2BA2BF406a52E0"
    l1-contracts:
      locator: embedded
    l2-contracts:
      locator: embedded
    overrides:
      seconds_per_slot: 2
      fjord_time_offset: 0
      granite_time_offset: 0
      holocene_time_offset: 0

  components:
    op-node:
      version: op-node/v1.10.2
    op-geth:
      version: op-geth/v1.101411.4-rc.4
    op-reth:
      version: op-reth/v1.1.5
    op-batcher:
      version: op-batcher/v1.10.0-rc.4
    op-proposer:
      version: op-proposer/v1.10.0-rc.2
    op-challenger:
      version: op-challenger/v1.3.1-rc.4
    op-conductor:
      version: op-conductor/v0.7.0
    op-conductor-ops:
      version: op-conductor-ops/v0.0.1
    op-conductor-mon:
      version: v0.0.5
    op-dispute-mon:
      version: v1.5.2
    proxyd:
      version: proxyd/v4.16.0
    peer-mgmt-service:
      version: v0.0.4
    # Interop components: the supernode serves the super-root the proposer and
    # challenger both derive from; op-interop-filter is required by the interop feature.
    op-supernode:
      version: v0.2.0
    op-interop-filter:
      version: op-interop-filter/v0.2.1-rc.2
    op-program:
      version: op-program/v1.9.0-rc.1
    kona-program:
      version: kona-client/v1.6.0

  charts:
    node:
      version: 0.23.1
    op-batcher:
      version: 0.2.5
    op-proposer:
      version: 0.2.3

  chains:
    - name: dev-pcd-interop-0
      chain_id: "420100009"
      features:
        - fp-permissionless
        - fp-interop
